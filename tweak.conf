# Cepheus Gaming Tweaks - konfigurasi
# =true aktifkan bagian, =false matikan
GP_IO=true
GP_VM=true
GP_GPU=true

# Lepas throttle thermal (pause daemon) HANYA saat game terdeteksi
GP_THERMAL=true

# Dinamis: GPU floor + pelepas thermal hanya aktif saat game
# (mengikuti status game milik Encore; tidak menulis apa pun ke Encore)
GP_DYNAMIC=true

# Daemon thermal userspace yang di-pause saat game (pisah spasi).
# Xiaomi Mi 9: mi_thermald  (thermal-engine dibiarkan jalan)
THERMAL_DAEMONS=mi_thermald

# Nilai yang dipakai (ubah lalu reboot)
GPU_GAME_PWRLEVEL=4
GPU_IDLE_PWRLEVEL=6
IO_SCHED=deadline
VM_VFS_CACHE_PRESSURE=60
VM_DIRTY_WRITEBACK_CS=1000
