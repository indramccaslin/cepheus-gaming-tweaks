# Cepheus Game Booster - configuration
# =true enable a section, =false disable it
GP_IO=true
GP_VM=true
GP_GPU=true

# Release thermal throttling (pause daemon) ONLY while a game is detected
GP_THERMAL=true

# Dynamic: GPU floor + thermal release active only during games
# (follows Encore's game state; writes nothing to Encore)
GP_DYNAMIC=true

# Userspace thermal daemon(s) to pause during games (space-separated).
# Xiaomi Mi 9: mi_thermald  (thermal-engine is left running)
THERMAL_DAEMONS=mi_thermald

# Values in use (edit then reboot)
GPU_GAME_PWRLEVEL=4
GPU_IDLE_PWRLEVEL=6
IO_SCHED=deadline
VM_VFS_CACHE_PRESSURE=60
VM_DIRTY_WRITEBACK_CS=1000
